name: Bug 报告
description: 发现了一个问题？告诉我们
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量填写完整，以便我们快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述 Bug 是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际上发生了什么？
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: 如果适用，请添加截图帮助说明问题

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Web 浏览器
        - Electron 桌面端 (Windows)
        - 其他
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器 / 系统版本
      placeholder: "例如：Chrome 124 / Windows 11"

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他任何有助于排查问题的信息
