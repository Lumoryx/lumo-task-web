name: 功能请求
description: 有新想法？欢迎提出
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交功能请求！请描述你的需求，我们会认真评估。

  - type: textarea
    id: problem
    attributes:
      label: 问题 / 动机
      description: 这个功能要解决什么问题？或者你遇到了什么不方便的场景？
      placeholder: "我经常需要... 但现在...很麻烦"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望的功能是什么样的
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否考虑过其他方案？为什么它们不够好？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考产品、设计草图等
