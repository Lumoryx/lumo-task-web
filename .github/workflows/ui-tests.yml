name: UI Automation Tests

# ── Triggers ──────────────────────────────────────────────────────────────────
#
# 1. Daily schedule — runs the full suite against the local dev stack at
#    02:00 UTC every day.
#
# 2. Push — smoke-tests any push that touches web-app code or this workflow.
#
# 3. Manual (workflow_dispatch) — lets you point the suite at any deployed URL.
#    Leave both URL inputs empty to fall back to the local dev stack.
#
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  push:
    branches: ["**"]
    paths:
      - "web-app/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: |
          Frontend URL to test.
          Leave empty to spin up the local Vite dev server.
          Example: https://lumo-task-xyz.vercel.app
        required: false
        default: ""
      api_url:
        description: |
          Backend API base URL (without trailing slash).
          Leave empty to start the local backend.
          Example: https://lumo-task-backend.onrender.com/v1
        required: false
        default: ""
      test_email:
        description: "E2E test account email (default: e2e@lumo.test)"
        required: false
        default: ""
      test_password:
        description: "E2E test account password"
        required: false
        default: ""

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

# ── Env resolution ─────────────────────────────────────────────────────────────
#
# Workflow_dispatch inputs take priority; CI secrets are the fallback for
# credentials. When both are empty the test suite defaults to localhost.
#
env:
  BASE_URL:      ${{ github.event.inputs.base_url      || '' }}
  API_BASE_URL:  ${{ github.event.inputs.api_url       || '' }}
  TEST_EMAIL:    ${{ github.event.inputs.test_email    || secrets.E2E_TEST_EMAIL    || 'e2e@lumo.test' }}
  TEST_PASSWORD: ${{ github.event.inputs.test_password || secrets.E2E_TEST_PASSWORD || 'e2eTestPass2024!' }}

jobs:
  ui-test:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # Node 22 required for node:sqlite (backend)
          cache: npm
          cache-dependency-path: |
            web-app/package-lock.json
            backend/package-lock.json

      # ── 3. Install deps ───────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci
        working-directory: web-app

      - name: Install backend deps
        if: env.API_BASE_URL == ''
        run: npm ci --include=dev
        working-directory: backend

      # ── 4. Build & start the backend (only when testing localhost) ────────
      - name: Build backend
        if: env.API_BASE_URL == ''
        run: npm run build
        working-directory: backend

      - name: Start backend
        if: env.API_BASE_URL == ''
        run: node dist/bundle.cjs &
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 47291
          LUMO_JWT_SECRET: ci-test-jwt-secret-key-32chars
          LUMO_ALLOWED_ORIGINS: "http://localhost:5173"

      - name: Wait for backend to be ready
        if: env.API_BASE_URL == ''
        run: |
          echo "Waiting for backend on :47291…"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:47291/health; then
              echo "Backend ready."
              break
            fi
            echo "  attempt $i/30…"
            sleep 2
          done

      # ── 5. Set effective API_BASE_URL (localhost fallback) ─────────────────
      - name: Resolve API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL=http://localhost:47291/v1" >> "$GITHUB_ENV"
          fi

      # ── 6. Install Playwright browsers ────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-app

      # ── 7. Run tests ──────────────────────────────────────────────────────
      - name: Run UI tests
        run: npm run test:e2e
        working-directory: web-app
        env:
          CI: "true"
          BASE_URL:      ${{ env.BASE_URL }}
          API_BASE_URL:  ${{ env.API_BASE_URL }}
          TEST_EMAIL:    ${{ env.TEST_EMAIL }}
          TEST_PASSWORD: ${{ env.TEST_PASSWORD }}

      # ── 8. Upload Playwright HTML report (always) ─────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: web-app/playwright-report/
          retention-days: 14

      # ── 9. Upload traces / screenshots / videos (failures only) ──────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: web-app/test-results/
          retention-days: 7
