name: UI Automation Tests (Daily)

# Run every day at 02:00 UTC.
# Also runs on every push to any branch (as a smoke check) and can be
# triggered manually.
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  push:
    branches: ["**"]
    paths:
      - "web-app/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      # ── 3. Install deps ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Install Playwright browsers ────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 5. Run tests ──────────────────────────────────────────────────────
      - name: Run UI tests
        run: npm run test:e2e
        env:
          CI: "true"

      # ── 6. Upload Playwright report (always, even on failure) ─────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: web-app/playwright-report/
          retention-days: 14

      # ── 7. Upload test results (traces / screenshots / videos) ────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: web-app/test-results/
          retention-days: 7
