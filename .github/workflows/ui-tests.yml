name: UI Tests (Daily)

on:
  # Run every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  ui-test:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        env:
          # Use a writable local cache; /opt/pw-browsers is read-only in CI
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

      - name: Run UI tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
          # Suppress browser "open" behaviour from Vite
          BROWSER: none

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: web-app/playwright-report/
          retention-days: 14

      - name: Upload test videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ github.run_id }}
          path: web-app/test-results/
          retention-days: 7
