name: UI Automation Tests

# ── Triggers ──────────────────────────────────────────────────────────────────
#
# 1. Daily — runs the full suite against the local dev stack at 02:00 UTC.
# 2. Push  — smoke-tests any push that touches web-app code or this workflow.
# 3. Manual (workflow_dispatch) — point the suite at any deployed URL.
#    Leave both URL inputs empty to fall back to the local dev stack.
#
on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: ["**"]
    paths:
      - "web-app/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: |
          Frontend URL to test.
          Leave empty to spin up the local Vite dev server.
          Example: https://lumo-task-xyz.vercel.app
        required: false
        default: ""
      api_url:
        description: |
          Backend API base URL (without trailing slash).
          Leave empty to start the local backend.
          Example: https://lumo-task-backend.onrender.com/v1
        required: false
        default: ""
      test_email:
        description: "E2E test account email (default: alex@stride.studio)"
        required: false
        default: ""
      test_password:
        description: "E2E test account password (default: demo1234)"
        required: false
        default: ""

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL:      ${{ github.event.inputs.base_url      || '' }}
  API_BASE_URL:  ${{ github.event.inputs.api_url       || '' }}
  TEST_EMAIL:    ${{ github.event.inputs.test_email    || secrets.E2E_TEST_EMAIL    || '' }}
  TEST_PASSWORD: ${{ github.event.inputs.test_password || secrets.E2E_TEST_PASSWORD || '' }}

jobs:
  ui-test:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node (22 required for backend node:sqlite) ─────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web-app/package-lock.json
            backend/package-lock.json

      # ── 3. Install frontend deps ──────────────────────────────────────────
      #    ELECTRON_SKIP_BINARY_DOWNLOAD prevents the postinstall script from
      #    downloading the Electron binary — we only need Playwright here.
      - name: Install frontend deps
        run: npm ci
        working-directory: web-app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # ── 4. Build and start local backend (skipped for remote targets) ─────
      - name: Install backend deps
        if: env.API_BASE_URL == ''
        run: npm ci --include=dev
        working-directory: backend

      - name: Build backend
        if: env.API_BASE_URL == ''
        run: npm run build
        working-directory: backend

      - name: Start backend
        if: env.API_BASE_URL == ''
        working-directory: backend
        run: node dist/bundle.cjs &
        env:
          NODE_ENV: test
          LUMO_PORT: 47291
          LUMO_JWT_SECRET: ci-test-jwt-secret-32chars-xxxx
          # Use in-memory SQLite so tests are isolated and leave no files behind
          LUMO_DB_PATH: ":memory:"

      - name: Wait for backend to be ready
        if: env.API_BASE_URL == ''
        run: |
          echo "Waiting for backend on :47291…"
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:47291/health > /dev/null; then
              echo "Backend ready (attempt $i)."
              READY=1
              break
            fi
            echo "  attempt $i/30 — sleeping 2s"
            sleep 2
          done
          if [ "$READY" -eq 0 ]; then
            echo "Backend did not become ready within 60 s."
            exit 1
          fi

      # ── 5. Resolve effective BASE_URL and API_BASE_URL ───────────────────
      - name: Set BASE_URL for local frontend
        if: env.BASE_URL == ''
        run: echo "BASE_URL=http://localhost:5173" >> "$GITHUB_ENV"

      - name: Set API_BASE_URL for local backend
        if: env.API_BASE_URL == ''
        run: echo "API_BASE_URL=http://localhost:47291/v1" >> "$GITHUB_ENV"

      # ── 6. Install Playwright browsers (cached) ───────────────────────────
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web-app/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web-app

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web-app

      # ── 7. Run tests ──────────────────────────────────────────────────────
      - name: Run UI tests
        run: npm run test:e2e
        working-directory: web-app
        env:
          CI: "true"
          BASE_URL:      ${{ env.BASE_URL }}
          API_BASE_URL:  ${{ env.API_BASE_URL }}
          TEST_EMAIL:    ${{ env.TEST_EMAIL }}
          TEST_PASSWORD: ${{ env.TEST_PASSWORD }}

      # ── 8. Upload Playwright HTML report ──────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: web-app/playwright-report/
          retention-days: 14

      # ── 9. Upload traces / screenshots / videos ───────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: web-app/test-results/
          retention-days: 7
