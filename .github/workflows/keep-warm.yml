name: Keep Render Warm

# Render free tier spins down after 15 min idle. The first request back gets
# a redirect (302) from Render's infrastructure before the backend starts —
# browsers refuse to follow that redirect for CORS preflight (OPTIONS), so
# users see a CORS error on first load.
#
# This workflow pings /health every 10 minutes to keep the service alive.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, 24/7
  workflow_dispatch:          # allow manual trigger for testing

jobs:
  ping:
    name: Ping backend health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://lumo-task-backend.onrender.com/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: health check returned $STATUS (service may be waking up)"
          fi
