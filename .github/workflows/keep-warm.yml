name: Keep Render Warm

# Render free tier spins down after 15 min idle. The first request back gets
# a redirect (302) from Render's infrastructure before the backend starts —
# browsers refuse to follow that redirect for CORS preflight (OPTIONS), so
# users see a CORS error on first load.
#
# This workflow pings /health every 10 minutes to keep the service alive.
#
# Why --max-time 90:
#   Render cold-start (free tier) can take 50–90 s to spin back up.
#   The old 30 s limit caused curl to exit with code 28 (OPERATION_TIMEOUT),
#   which bash -e treated as a fatal error before the warning message ran.
#
# Why `|| STATUS="timeout"`:
#   Prevents any curl error (DNS, TCP reset, timeout) from propagating a
#   non-zero exit code under bash -e. The job's purpose is to send a ping,
#   not to gate on the response — a warning is enough.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, 24/7
  workflow_dispatch:          # allow manual trigger for testing

jobs:
  ping:
    name: Ping backend health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            https://lumo-task-backend.onrender.com/health) || STATUS="timeout"
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✓ Backend is warm"
          else
            echo "Warning: health check returned '$STATUS' (service may be waking up)"
          fi
