name: Release (Windows)

# Triggered manually. Tag is auto-generated as v{YYYY.MM.DD}-{sha} to comply
# with repository tag-creation rules. An optional version_label (e.g. "v1.0.1")
# is embedded in the release name for human readability.
on:
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Version label shown in release name, e.g. v1.0.1 (optional)'
        required: false
        default: ''

# GITHUB_TOKEN needs write access to create releases and tags.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Install backend deps
        run: npm ci --include=dev
        working-directory: backend

      - name: Build backend bundle
        run: npm run build
        working-directory: backend

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci
        working-directory: web-app

      - name: Build frontend
        run: npm run build
        working-directory: web-app

      # ── Electron packaging ─────────────────────────────────────────────────
      - name: Package Windows installer (NSIS x64)
        run: npx electron-builder --win --x64 --publish never
        working-directory: web-app

      # ── Find the produced .exe ─────────────────────────────────────────────
      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "web-app/dist-electron" -Filter "*.exe" -Recurse |
                  Select-Object -First 1
          "path=$($file.FullName)"  | Out-File -Append $env:GITHUB_OUTPUT
          "name=$($file.Name)"      | Out-File -Append $env:GITHUB_OUTPUT

      # ── Generate release tag (v{YYYY.MM.DD}-{short-sha}) ──────────────────
      - name: Generate release tag and name
        id: release-meta
        shell: pwsh
        run: |
          $date  = Get-Date -Format "yyyy.MM.dd"
          $sha   = "${{ github.sha }}".Substring(0, 7)
          $tag   = "v${date}-${sha}"
          $label = "${{ github.event.inputs.version_label }}".Trim()
          $name  = if ($label) { "Lumo Task ${label} (${tag})" } else { "Lumo Task ${tag}" }
          "tag=$tag"   | Out-File -Append $env:GITHUB_OUTPUT
          "name=$name" | Out-File -Append $env:GITHUB_OUTPUT

      # ── Create GitHub Release & upload installer ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name:     ${{ steps.release-meta.outputs.name }}
          draft:    false
          files:    ${{ steps.installer.outputs.path }}
          body: |
            ## Lumo Task for Windows (x64)

            下载 `${{ steps.installer.outputs.name }}` 双击安装即可。

            > **提示**：首次运行 Windows 可能弹出 SmartScreen 安全提示，点击「更多信息」→「仍要运行」即可正常安装。

            ---
            **构建信息**
            - Commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - 版本标签: `${{ github.event.inputs.version_label || '(未设置)' }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
