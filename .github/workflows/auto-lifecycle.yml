name: Auto Issue Lifecycle Management

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  manage-lifecycle:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark issues as stale
        uses: actions/github-script@v7
        with:
          script: |
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'needs-info,needs-repro',
              per_page: 100
            });

            for (const issue of issues.data) {
              const updatedAt = new Date(issue.updated_at);
              if (updatedAt < thirtyDaysAgo) {
                // Add stale label
                await github.rest.issues.addLabels({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: ['stale']
                });

                // Post warning comment
                await github.rest.issues.createComment({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `⚠️ **This issue is marked as stale** because it has been inactive for 30 days.

It will be closed in 14 days if no activity occurs. To keep it open:
- Provide more information if requested (\`needs-info\`)
- Provide reproduction steps if needed (\`needs-repro\`)
- Comment to show continued interest

Thank you for your patience!`
                });
              }
            }

      - name: Close stale issues
        uses: actions/github-script@v7
        with:
          script: |
            const fourtyFourDaysAgo = new Date();
            fourtyFourDaysAgo.setDate(fourtyFourDaysAgo.getDate() - 44);

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale',
              per_page: 100
            });

            for (const issue of issues.data) {
              const updatedAt = new Date(issue.updated_at);
              if (updatedAt < fourtyFourDaysAgo) {
                // Close the issue
                await github.rest.issues.update({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'closed',
                  state_reason: 'not_planned'
                });

                // Post closing comment
                await github.rest.issues.createComment({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `🔒 **This issue has been automatically closed** due to inactivity.

If you believe this should remain open, please:
1. Provide the requested information
2. Comment to reopen the conversation

Thank you for your understanding!`
                });
              }
            }

      - name: Lock closed issues
        uses: actions/github-script@v7
        with:
          script: |
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100
            });

            for (const issue of issues.data) {
              const closedAt = new Date(issue.closed_at || issue.updated_at);
              if (closedAt < sevenDaysAgo) {
                // Lock the issue
                await github.rest.issues.lock({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  lock_reason: 'resolved'
                });
              }
            }
