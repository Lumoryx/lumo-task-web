name: Auto Triage Issues

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-label new issues
        run: |
          echo "Issue #${{ github.event.issue.number }} opened"
          echo "Title: ${{ github.event.issue.title }}"
          echo "Body: ${{ github.event.issue.body }}"

      # Add 'needs-triage' label to new issues
      - name: Add needs-triage label
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['needs-triage']
            })

      # Post a comment guiding the issue author
      - name: Post triage guidance comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Thank you for opening this issue! 👋

**Next steps:**
1. Our triage team will review and classify this issue
2. We'll assign appropriate labels (type, priority, component)
3. We'll link to related issues or epics if applicable

**In the meantime:**
- Provide as much detail as possible (steps to reproduce, screenshots, logs)
- Check [existing issues](../../issues) to avoid duplicates
- Review our [contribution guide](.github/CONTRIBUTING.md)

We appreciate your help!`
            })
