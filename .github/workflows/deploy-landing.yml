name: Deploy Landing Page

# Deploys landing/index.html to GitHub Pages whenever it changes on main.
# Works alongside the Vercel deployment — use whichever you prefer.
#
# To enable GitHub Pages:
#   Repo Settings → Pages → Source: "GitHub Actions" → Save

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload landing/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
