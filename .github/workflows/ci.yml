name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Frontend — Type Check ───────────────────────────────────────────────
  typecheck:
    name: Type Check (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

  # ── 2. Frontend — Lint ────────────────────────────────────────────────────
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ── 3. Frontend — Build ───────────────────────────────────────────────────
  build:
    name: Build (frontend)
    runs-on: ubuntu-latest
    needs: [typecheck]
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vite production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: web-app/dist
          retention-days: 7

  # ── 4. Backend — Type Check ───────────────────────────────────────────────
  backend-typecheck:
    name: Type Check (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

  # ── 5. Backend — Build ────────────────────────────────────────────────────
  backend-build:
    name: Build (backend)
    runs-on: ubuntu-latest
    needs: [backend-typecheck]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── 6. Security — npm audit ───────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      # devDeps (electron, electron-builder, vite, esbuild) are build-only tools
      # and are never shipped to production — omit them from the audit.
      - name: Audit frontend deps (production only)
        run: cd web-app && npm ci && npm audit --audit-level=high --omit=dev

      - name: Audit backend deps
        run: cd backend && npm ci && npm audit --audit-level=high

  # ── 7. Aggregate gate ─────────────────────────────────────────────────────
  #    Branch protection watches only this job.
  ci:
    name: CI
    if: always()
    needs: [typecheck, lint, build, backend-typecheck, backend-build, security]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more CI checks failed."
            exit 1
          fi
          echo "All CI checks passed."
