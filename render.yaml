services:
  - type: web
    name: lumo-task-backend
    runtime: node
    rootDir: backend
    region: singapore          # closest to CN users; change to ohio/oregon as needed
    plan: free                 # free tier: spins down after 15 min idle, ephemeral storage
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/bundle.cjs
    healthCheckPath: /health

    # Data persistence via Turso (free hosted SQLite).
    # Sign up at https://turso.tech, create a DB, then add the two env vars below
    # in the Render dashboard. Without them the backend falls back to a local
    # file: which IS ephemeral on Render free tier.

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LUMO_JWT_SECRET
        generateValue: true    # Render auto-generates a secure random value
      - key: LUMO_ALLOWED_ORIGINS
        sync: false            # Set manually in Render dashboard after Vercel deploy
      - key: TURSO_DATABASE_URL
        sync: false            # libsql://your-db-name-<org>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false            # token from: turso db tokens create <db-name>
