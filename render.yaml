services:
  - type: web
    name: lumo-task-backend
    runtime: node
    rootDir: backend
    region: singapore          # closest to CN users; change to ohio/oregon as needed
    plan: free                 # free tier: spins down after 15 min idle, ephemeral storage
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/bundle.cjs
    healthCheckPath: /health

    # NOTE: No persistent disk on free plan.
    # SQLite data lives in the ephemeral filesystem and is reset on each deploy
    # or cold-start. Suitable for demo / development use.
    # Upgrade to Render Starter ($7/mo) and re-add the disk block to persist data.

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"            # node:sqlite requires Node >= 22.5
      - key: LUMO_JWT_SECRET
        generateValue: true    # Render auto-generates a secure random value
      - key: LUMO_ALLOWED_ORIGINS
        sync: false            # Set manually in Render dashboard after Vercel deploy
